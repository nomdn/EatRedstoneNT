# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    tags:
      - "v*" 
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          # PyQt6 依赖
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libxcb-xinerama0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-render-util0 \
          libxcb-xkb1 \
          libxkbcommon-x11-0 \
          libxkbcommon-dev \
          # pygame 依赖
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libfreetype6-dev \
          pkg-config \
          libportmidi-dev \
          libharfbuzz-dev \
          # 其他可能需要的依赖
          libdbus-1-dev \
          libssl-dev \
          libsqlite3-dev \
          libpq-dev \
          # 构建工具
          build-essential \
          cmake \
          ninja-build
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Download Appimage Python And Kit
      run: |
        wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
        wget https://github.com/niess/python-appimage/releases/download/python3.14/python3.14.0-cp314-cp314-manylinux2014_aarch64.AppImage
        chmod +x python3.14.0-cp314-cp314-manylinux2014_aarch64.AppImage
        chmod +x appimagetool-aarch64.AppImage
        ./python3.14.0-cp314-cp314-manylinux2014_aarch64.AppImage --appimage-extract
        ./squashfs-root/AppRun -m pip install -r requirements.txt
        ./appimagetool-x86_64.AppImage \
        squashfs-root \
        python3.14_aarch64.AppImage
    - name: Create run script
      run: |
        echo -e '#!/bin/bash\nchmod +x python3.14_aarch64.AppImage\n./python3.14_aarch64.AppImage main.py' > run.sh
        chmod +x run.sh
        
    - name: Upload ARM64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-appimage-arm64
        path: |
          python3.14_aarch64.AppImage
          run.sh
        retention-days: 7
